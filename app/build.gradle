plugins {
    id 'com.android.application'
}

ext {
    sdk_version = [
            compile: 36,   // compileSdkVersion
            target : 35,   // targetSdkVersion
            min    : 25    // minSdkVersion
    ]
}

android {
    namespace 'com.zhuchao.android.car'

    compileSdkVersion sdk_version.compile
    defaultConfig {
        minSdk sdk_version.min
        targetSdk sdk_version.target

        versionCode 1
        versionName "1.0"
        ndk {
            //noinspection ChromeOsAbiSupport,ChromeOsAbiSupport
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
        ///testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            keyAlias 'rkpx5'
            keyPassword 'android'
            storeFile file('rkpx5.jks')
            storePassword 'android'
        }
    }

    buildTypes {
        debug {
            //在debug模式下引用该签名文件
            signingConfig signingConfigs.release
        }
        release {
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    buildFeatures {
        aidl = true
    }
    packagingOptions {
        jniLibs {
            pickFirsts += ['lib/x86/libc++_shared.so', 'lib/arm64-v8a/libc++_shared.so', 'lib/armeabi-v7a/libc++_shared.so', 'lib/x86_64/libc++_shared.so', 'lib/arm64-v8a/libopencv_java4.so', 'lib/armeabi-v7a/libopencv_java4.so', 'lib/x86/libopencv_java4.so', 'lib/x86_64/libopencv_java4.so']
        }
    }

    lint {
        baseline file('lint-baseline.xml')
        disable += 'MissingTranslation'
    }

    android.applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            def date = new Date().format("yyyyMMddHHmm", TimeZone.getTimeZone("GMT+08"))
            ///if (variant.buildType.name == 'release') {
                //outputFileName = "MyCarService_${date}.apk"
                outputFileName = "MServicesX.apk"
            //}
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    implementation(platform("org.jetbrains.kotlin:kotlin-bom:2.2.20"))
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'com.google.ar:core:1.52.0'

    implementation('com.zhuchao.android:libBaseUtils:2.2.3@aar')//框架基础类
    implementation('com.zhuchao.android:libCameraUtils:1.0@aar')//相机控制
    ///implementation('com.zhuchao.android:libDecodeCore:1.6@aar')//播放器的核心解码库
    implementation('com.zhuchao.android:libDNetUtils:2.1.1@aar')//网络接口
    //noinspection Aligned16KB
    implementation('com.zhuchao.android:libFOSUtils:1.4.2@aar')//平台接口
    implementation('com.zhuchao.android:libFPersistUtils:1.2@aar')//数据存储
    implementation('com.zhuchao.android:libGXMediaUtils:2.0@aar')//媒体管理类
    implementation('com.zhuchao.android:libGXPlayerUtils:3.0@aar')//播放器
    //noinspection Aligned16KB
    implementation('com.zhuchao.android:libOpenComputerVision:1.0@aar')//机器视觉
    //noinspection Aligned16KB
    implementation('com.zhuchao.android:libOpenDetection:1.0@aar')//人脸检测识别
    implementation('com.zhuchao.android:libOpenLargeModelDeepLearning:1.0@aar')//大模型与深度学习
    implementation('com.zhuchao.android:libSessionUtils:2.9.3@aar')//会话管理、杂项

}