plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zhuchao.android.car'
    compileSdk 34

    defaultConfig {
        applicationId "com.zhuchao.android.car"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    //aaptOptions {
    //    additionalParameters '--extra-packages', 'com.android.zhuchao.car.R'
    //}
    lintOptions {
        baseline file("lint-baseline.xml")
    }

    externalNativeBuild {
        cmake {
            path 'CMakeLists.txt'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    android.applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            def date = new Date().format("yyyyMMddHHmm", TimeZone.getTimeZone("GMT+08"))
            if (variant.buildType.name == 'release') {
                //outputFileName = "MyCarService_${date}.apk"
                outputFileName = "MyCarService.apk"
            }
        }
    }
}

dependencies {
    implementation('com.zhuchao.android:libFBaseUtils:2.1@aar')
    implementation('com.zhuchao.android:libJOSUtils:1.4:@aar')

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'com.google.ar:core:1.42.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}